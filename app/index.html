<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPF Explorer — Imago UKRI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <header id="topbar">
      <div id="brand">
        <img src="../assets/Imago-logo.png" alt="Imago UKRI">
        <h1>SPF Explorer</h1>
      </div>
      <div id="year-selector">
        <button id="year-prev" aria-label="Previous year">&#8249;</button>
        <span id="year-display">2025</span>
        <button id="year-next" aria-label="Next year">&#8250;</button>
      </div>
    </header>

    <div id="main">

      <aside id="sidebar">
        <div id="sidebar-handle" role="button" aria-label="Toggle sidebar"></div>

        <div id="search-container">
          <input
            id="search-input"
            type="text"
            placeholder="Search area name or code…"
            autocomplete="off"
            spellcheck="false"
          >
          <div id="search-results" style="display:none"></div>
        </div>

        <div id="geo-section">
          <h3>Find me a sunny place</h3>
          <div id="geo-input-row">
            <input
              id="geo-place-input"
              type="text"
              placeholder="Place or postcode…"
              autocomplete="off"
              spellcheck="false"
            >
            <button id="geo-place-btn" class="geo-go-btn" aria-label="Search">&#8594;</button>
          </div>
          <button id="geo-locate-btn" class="sidebar-btn">&#128205; Use my location</button>
          <p id="geo-msg"></p>
        </div>

        <div id="decile-section">
          <h3>Jump to decile</h3>
          <div id="decile-grid"></div>
          <p class="decile-hint">1 = most cloud &nbsp;·&nbsp; 10 = most sun</p>
        </div>

        <div id="legend-section">
          <h3>Legend</h3>
          <div id="legend">
            <div class="legend-row"><span class="legend-swatch" style="background:#e3f2fd"></span><span>Decile 9–10 (most sun)</span></div>
            <div class="legend-row"><span class="legend-swatch" style="background:#64b5f6"></span><span>Decile 7–8</span></div>
            <div class="legend-row"><span class="legend-swatch" style="background:#2196f3"></span><span>Decile 4–6</span></div>
            <div class="legend-row"><span class="legend-swatch" style="background:#1565c0"></span><span>Decile 2–3</span></div>
            <div class="legend-row"><span class="legend-swatch" style="background:#0d47a1"></span><span>Decile 1 (most cloud)</span></div>
          </div>
        </div>

        <button id="reset-btn" class="sidebar-btn">Reset view</button>
      </aside>

      <div id="map"></div>

      <div id="info-panel" class="hidden">
        <button id="info-close" aria-label="Close">&times;</button>

        <!-- Mode: single area detail -->
        <div id="info-area">
          <h2 id="info-name"></h2>
          <p id="info-code" class="info-code"></p>
          <div class="info-stat">
            <span class="info-stat-label">Cloud probability</span>
            <span id="info-value" class="info-stat-value"></span>
          </div>
          <div class="info-stat">
            <span class="info-stat-label">National decile</span>
            <span id="info-decile" class="info-stat-value"></span>
          </div>
          <p class="info-peers-note" id="info-peers-note"></p>
        </div>

        <!-- Mode: geo search results list -->
        <div id="info-geo" class="hidden">
          <h2 id="info-geo-title"></h2>
          <p id="info-geo-sub" class="info-code"></p>
          <div id="geo-results"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pmtiles@3/dist/pmtiles.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="main.js"></script>
</body>
</html>
